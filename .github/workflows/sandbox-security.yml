name: Sandbox Security Invariants Gate

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/test-sandbox-invariants.ts'
      - 'docs/SANDBOX_SECURITY_SPEC.md'
      - '.github/workflows/sandbox-security.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  sandbox-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Sandbox Invariants Audit
        run: npx tsx scripts/test-sandbox-invariants.ts
